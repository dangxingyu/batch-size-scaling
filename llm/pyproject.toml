[project]
name = "bsz-lm"
version = "0.1.0"
description = "Language-model trainer and directional-branching code for the batch-size scaling experiments."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "pyyaml>=6.0.2,<7",
    "torch>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
bsz-lm = "bsz_lm.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bsz_lm"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
